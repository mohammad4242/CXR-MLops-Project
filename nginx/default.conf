# =====================================================================
# Public reverse-proxy gateway — the single entry point to the stack.
#
#   /api/*  ->  FastAPI backend  (api:8000, "/api" prefix stripped)
#   /*      ->  React SPA        (frontend:80, static files)
#
# TLS is terminated here using the Cloudflare Origin Certificate that
# lives on the VPS at /etc/ssl/cloudflare/ (mounted read-only by compose).
# Because the browser only ever talks to this one origin, CORS never
# comes into play in production.
# =====================================================================

# ---- HTTP (port 80): redirect everything to HTTPS ----
# Cloudflare can also enforce this at its edge ("Always Use HTTPS"), but
# we redirect here too so a direct hit on http never serves the app.
server {
  listen 80 default_server;
  server_name cxrscan.ir www.cxrscan.ir;

  return 301 https://$host$request_uri;
}

# ---- HTTPS (port 443): the real gateway ----
server {
  listen 443 ssl default_server;
  http2 on;
  server_name cxrscan.ir www.cxrscan.ir;

  # Cloudflare Origin Certificate + its private key, mounted from the VPS.
  ssl_certificate     /etc/ssl/cloudflare/cert.pem;
  ssl_certificate_key /etc/ssl/cloudflare/key.pem;

  # Sensible, modern TLS defaults.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Chest X-rays can be a few megabytes — allow comfortably large uploads.
  client_max_body_size 50M;

  # ---- API ----
  # "/api/predict" on the browser becomes "/predict" on the FastAPI app.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CPU inference (and first-run model download) can be slow.
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # ---- Frontend ----
  # Everything else is served by the static-only frontend container.
  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Gateway liveness ----
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
