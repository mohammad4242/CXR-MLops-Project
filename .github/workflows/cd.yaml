name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}  # allow manual "Run workflow" / gh workflow run

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run on a manual dispatch, or after a successful CI Pipeline run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The VPS can't reliably clone from GitHub, but GitHub's runner CAN reach
      # the VPS — so we copy the compose file and gateway config straight up.
      # (.env is created/managed on the server and is never overwritten here.)
      - name: Copy compose + gateway config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "~/cxr-pred"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true  # fail the step on the first error (no silent "success")
          script: |
            cd ~/cxr-pred
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
