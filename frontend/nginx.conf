# Static-only server for the compiled React SPA.
#
# API routing lives in the dedicated gateway (../nginx/default.conf); this
# container just serves files and falls back to index.html for client-side
# routes. When developing without the gateway, Vite's dev proxy handles /api.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single Page Application fallback: unknown paths return index.html so
  # client-side routing keeps working on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache fingerprinted static assets aggressively.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Lightweight liveness endpoint for container health checks.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
