services:
  # 1. The Database Service
  db:
    image: postgres:15
    container_name: cxr_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data  # Saves your DB data so it isn't lost on restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. The FastAPI Service (internal — reached through the nginx gateway)
  api:
    image: mohammad4242/myapi:latest
    container_name: cxr_api
    restart: always
    # `build` lets `docker compose up --build` build the API locally; on the
    # server the CD pipeline uses the pre-built image pulled from Docker Hub.
    build:
      context: .
    env_file:
      - .env
    expose:
      - "8000"  # Visible to other containers (nginx), not published to the host
    depends_on:
      db:
        condition: service_healthy  # Wait until PostgreSQL is actually ready, not just started
    volumes:
      - ./images:/app/images  # Syncs the saved images to your Linux folder
    # Report real readiness in `docker ps`. The slim image has no curl, so we
    # hit /health with Python's stdlib. start_period is generous because the
    # model (and its weights, on first run) takes a while to load.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  # 3. The Frontend Service (compiled React SPA, served statically — internal)
  frontend:
    image: mohammad4242/myfrontend:latest
    container_name: cxr_frontend
    restart: always
    # `build` lets `docker compose up --build` build locally; on the server the
    # CD pipeline uses the pre-built image pulled from Docker Hub instead.
    build:
      context: ./frontend
    expose:
      - "80"  # Served to the public through the nginx gateway, not directly
    depends_on:
      - api

  # 4. The Nginx Gateway (single public entry point / reverse proxy)
  # Routes /api/* to the FastAPI container and everything else to the frontend,
  # so the browser only ever talks to one origin (no CORS in production).
  nginx:
    image: nginx:1.27-alpine
    container_name: cxr_nginx
    restart: always
    ports:
      - "5173:80"  # Visit http://<server-ip>:5173 — kept on 5173 to match existing firewall
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api

volumes:
  pg_data:  # Defines the volume for the database
